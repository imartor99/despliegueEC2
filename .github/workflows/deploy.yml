
name: CI/CD Despliegue a EC2

# El workflow se dispara en push a las ramas de desarrollo y principal
on:
  push:
    branches:
      - main
      - dev
      - 'feature/**' 

jobs:
  # 1. CI (Integración Continua): Pruebas y Documentación
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout del código
        uses: actions/checkout@v4

      - name: 🛠️ Configurar Node.js e Instalar Dependencias
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install

      - name: 🔑 Dar permisos de ejecución a los binarios
        # Soluciona el error 'Permission denied' para Jest/JSDoc
        run: |
          chmod +x ./node_modules/.bin/jest
          chmod +x ./node_modules/.bin/jsdoc

      - name: ✅ Ejecutar Pruebas Unitarias (Tarea 2)
        run: ./node_modules/.bin/jest
      
      - name: 📄 Generar Documentación (JSDoc - Tarea 3)
        run: ./node_modules/.bin/jsdoc script.js -d out -r

      - name: 📤 Subir Documentación como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: documentacion-jsdoc
          path: out/

  # 2. CD (Despliegue Continuo): Copia de archivos a EC2 (Tarea 4)
  deploy:
    needs: ci # Solo se ejecuta si el job 'ci' pasa
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' 
    runs-on: ubuntu-latest
    
    steps:
      - name: ⬇️ Checkout del código
        uses: actions/checkout@v4

      - name: 📤 Copiar Archivos a EC2 (SCP)
        # Usa la acción de copia segura (SCP) con la clave privada SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "index.html,style.css,script.js" # Archivos a desplegar
          target: "/tmp/app_deploy" # Carpeta temporal en EC2
          strip_components: 0

      - name: 🔄 Mover Archivos al Directorio Web y Reiniciar Apache
        # Usa la acción SSH para ejecutar comandos con permisos de superusuario
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "Moviendo archivos a /var/www/html/..."
            # Copiar archivos copiados por SCP al directorio web de Apache2
            sudo cp -r /tmp/app_deploy/* /var/www/html/
            
            # Asignar permisos de lectura/ejecución al directorio web
            sudo chmod -R 755 /var/www/html/
            
            # Limpiar archivos temporales
            rm -rf /tmp/app_deploy
            
            # Reiniciar Apache (generalmente no es necesario, pero es seguro)
            sudo systemctl restart apache2
            
            echo "Despliegue a EC2 finalizado."